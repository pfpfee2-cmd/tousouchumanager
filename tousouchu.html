<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>逃走中 — リアルタイム鬼ごっこ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
:root{
  /* Apple design tokens */
  --primary:#0066cc; --primary-focus:#0071e3; --primary-on-dark:#2997ff;
  --ink:#1d1d1f; --ink80:#333333; --ink48:#7a7a7a;
  --divider:#f0f0f0; --hairline:#e0e0e0;
  --canvas:#ffffff; --parchment:#f5f5f7; --pearl:#fafafc;
  --tile1:#272729; --tile2:#2a2a2c; --tile3:#252527; --black:#000000;
  --on-dark:#ffffff; --body-muted:#cccccc; --chip:#d2d2d7;
  /* status semantics only — never used on interactive chrome */
  --alert:#d70015; --alert-on-dark:#ff453a; --good:#1d8a4e;
  --r-xs:5px; --r-sm:8px; --r-md:11px; --r-lg:18px; --r-pill:9999px;
  --s-xxs:4px; --s-xs:8px; --s-sm:12px; --s-md:17px; --s-lg:24px; --s-xl:32px; --s-xxl:48px;
  --nav:44px; --tabbar:56px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  position:fixed;inset:0;overflow:hidden;
  font-family:var(--text);font-size:17px;font-weight:400;line-height:1.47;letter-spacing:-0.374px;
  color:var(--ink);background:var(--parchment);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:none;outline:none;border-radius:0}
button{cursor:pointer}
input,textarea,select{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--primary-focus);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}

/* ── typography ─────────────────────────────── */
.t-hero{font-family:var(--display);font-size:56px;font-weight:600;line-height:1.07;letter-spacing:-0.28px}
.t-display{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.1}
.t-lead{font-family:var(--display);font-size:28px;font-weight:400;line-height:1.14;letter-spacing:0.196px}
.t-tagline{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.19;letter-spacing:0.231px}
.t-strong{font-size:17px;font-weight:600;line-height:1.24;letter-spacing:-0.374px}
.t-cap{font-size:14px;line-height:1.43;letter-spacing:-0.224px;color:var(--ink48)}
.t-cap-strong{font-size:14px;font-weight:600;line-height:1.29;letter-spacing:-0.224px}
.t-fine{font-size:12px;line-height:1.3;letter-spacing:-0.12px;color:var(--ink48)}
.on-dark .t-cap,.tile .t-cap{color:var(--body-muted)}

/* ── buttons ─────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;border-radius:var(--r-pill);
  padding:12px 22px;min-height:44px;font-size:17px;transition:transform .12s ease,opacity .12s;
}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.36;pointer-events:none}
.btn.block{display:flex;width:100%}
.btn.sec{background:var(--canvas);color:var(--primary);border:1px solid var(--hairline)}
.btn.sec.on-tile{background:transparent;color:var(--primary-on-dark);border-color:rgba(255,255,255,.24)}
.btn.util{background:var(--ink);color:#fff;border-radius:var(--r-sm);padding:10px 15px;font-size:14px;min-height:40px}
.btn.pearl{background:var(--pearl);color:var(--ink80);border:3px solid var(--divider);border-radius:var(--r-md);padding:8px 14px;font-size:14px;min-height:40px}
.btn.quiet{background:transparent;color:var(--primary);padding:10px 6px;min-height:40px}
.btn.destructive{background:var(--canvas);color:var(--alert);border:1px solid var(--hairline)}
.btn.sm{min-height:36px;padding:8px 16px;font-size:14px}
.link{color:var(--primary);background:none;padding:0;font-size:17px}
.icon-btn{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;background:rgba(210,210,215,.64);color:var(--ink);transition:transform .12s}
.icon-btn:active{transform:scale(.95)}

/* ── shell ─────────────────────────────── */
#app{height:100%;display:flex;flex-direction:column;background:var(--parchment);max-width:560px;margin:0 auto;position:relative;overflow:hidden}
.nav{
  background:var(--black);color:#fff;height:calc(var(--nav) + var(--sat));padding:var(--sat) 12px 0;
  display:flex;align-items:center;gap:10px;flex:none;position:relative;z-index:1200;
}
.nav .room{font-size:14px;letter-spacing:-0.224px;color:#fff;display:flex;align-items:center;gap:7px}
.nav .dot{width:7px;height:7px;border-radius:50%;background:var(--alert-on-dark);flex:none}
.nav .dot.ok{background:#30d158}
.nav .dot.wait{background:#ffd60a}
.nav .spacer{flex:1}
.nav button{color:var(--primary-on-dark);font-size:14px;padding:8px}
.nav .clock{font-family:var(--display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.nav .clock.crit{color:var(--alert-on-dark)}

.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.view.on{display:flex}
.view.nopad{padding:0}
.pad{padding:var(--s-md)}
.stack{display:flex;flex-direction:column;gap:var(--s-sm)}

.tabbar{
  flex:none;display:flex;background:rgba(245,245,247,.86);backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hairline);
  padding-bottom:var(--sab);position:relative;z-index:1200;
}
.tabbar button{position:relative;flex:1;padding:7px 2px calc(7px);display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink48);font-size:10px;letter-spacing:-0.08px;min-height:var(--tabbar)}
.tabbar button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--primary)}
.tabbar .badge{position:absolute;transform:translate(12px,-4px);background:var(--alert);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:var(--r-pill);font-weight:600}

/* ── tiles & cards ─────────────────────────────── */
.tile{background:var(--tile1);color:var(--on-dark);padding:var(--s-lg) var(--s-md)}
.tile.t2{background:var(--tile2)} .tile.t3{background:var(--tile3)} .tile.black{background:var(--black)}
.tile .t-cap{color:var(--body-muted)}
.card{background:var(--canvas);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:var(--s-md)}
.card.flush{padding:0;overflow:hidden}
.section-title{font-size:14px;font-weight:600;letter-spacing:-0.224px;color:var(--ink48);padding:var(--s-md) var(--s-md) var(--s-xs)}

.row{display:flex;align-items:center;gap:var(--s-sm);padding:12px var(--s-md);background:var(--canvas);width:100%;text-align:left;min-height:56px}
.row + .row{border-top:1px solid var(--divider)}
.row .grow{flex:1;min-width:0}
.row .chev{color:var(--ink48);flex:none}
.row:active{background:var(--parchment)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:6px 10px;border-radius:var(--r-pill);background:var(--parchment);color:var(--ink80);letter-spacing:-0.12px;white-space:nowrap}
.chip.alert{background:rgba(215,0,21,.1);color:var(--alert)}
.chip.good{background:rgba(29,138,78,.12);color:var(--good)}
.chip.solid-dark{background:rgba(255,255,255,.14);color:#fff}
.chip.hunter{background:var(--ink);color:#fff}

.avatar{width:38px;height:38px;border-radius:var(--r-pill);display:grid;place-items:center;flex:none;background:var(--parchment);color:var(--ink80);font-size:14px;font-weight:600}
.avatar.hunter{background:var(--ink);color:#fff}
.avatar.captured{background:var(--divider);color:var(--ink48)}
.avatar.me{box-shadow:0 0 0 2px var(--primary)}

/* ── hero timer (signature) ─────────────────────────────── */
.hero{background:var(--black);color:#fff;padding:var(--s-lg) var(--s-md) var(--s-lg);text-align:center}
.hero .label{font-size:12px;letter-spacing:0.4px;color:var(--body-muted);text-transform:uppercase}
.hero .time{font-family:var(--display);font-size:64px;font-weight:600;line-height:1;letter-spacing:-1.4px;font-variant-numeric:tabular-nums;margin-top:6px}
.hero .time.crit{color:var(--alert-on-dark)}
.hero .money{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:-0.6px;font-variant-numeric:tabular-nums;margin-top:14px}
.hero .sub{color:var(--body-muted);font-size:14px;margin-top:4px}
.hero .state{display:inline-block;margin-top:14px}
@media(max-width:400px){ .hero .time{font-size:52px} .hero .money{font-size:28px} }

/* ── join screen ─────────────────────────────── */
#join{position:absolute;inset:0;z-index:1400;background:var(--canvas);overflow-y:auto;display:flex;flex-direction:column}
#join .jhero{background:var(--black);color:#fff;padding:calc(var(--sat) + 40px) var(--s-md) 40px;text-align:center}
#join .jhero h1{font-family:var(--display);font-size:40px;font-weight:600;line-height:1.1;letter-spacing:-0.5px}
#join .jhero p{color:var(--body-muted);font-size:17px;margin-top:8px;line-height:1.47}
#join .body{padding:var(--s-lg) var(--s-md) calc(var(--s-xxl) + var(--sab));display:flex;flex-direction:column;gap:var(--s-lg);flex:1}
.rolegrid{display:flex;flex-direction:column;gap:10px}
.rolecard{
  display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--hairline);
  border-radius:var(--r-lg);background:var(--canvas);text-align:left;transition:transform .12s,border-color .12s;
}
.rolecard:active{transform:scale(.98)}
.rolecard.on{border:2px solid var(--primary-focus);padding:15px}
.rolecard .em{width:44px;height:44px;border-radius:var(--r-pill);display:grid;place-items:center;flex:none;background:var(--parchment)}
.rolecard.on .em{background:rgba(0,102,204,.1)}
.rolecard .em svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rolecard.on .em svg{stroke:var(--primary)}
.field{
  width:100%;background:var(--canvas);border:1px solid rgba(0,0,0,.08);border-radius:var(--r-pill);
  padding:12px 20px;min-height:48px;font-size:17px;
}
.field:focus{border-color:var(--primary-focus)}
.field.code{border-radius:var(--r-md);text-align:center;font-size:28px;font-family:var(--display);font-weight:600;letter-spacing:6px;text-transform:uppercase;padding:14px}
textarea.field{border-radius:var(--r-md);min-height:88px;resize:none;line-height:1.47}
.labelrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}

/* ── map ─────────────────────────────── */
.views{isolation:isolate}
.mapwrap{position:relative;flex:1;min-height:0;isolation:isolate;z-index:0}
#map{position:absolute;inset:0;background:var(--parchment);z-index:0}
/* Leaflet が 1000 番台を使うため、ラッパー内で番号を抑える */
.mapwrap .leaflet-pane{z-index:auto}
.mapwrap .leaflet-top,.mapwrap .leaflet-bottom{z-index:400}
.mapwrap .leaflet-control{z-index:auto}
.mapwrap .leaflet-popup-pane{z-index:450}
.mapwrap .leaflet-marker-pane,.mapwrap .leaflet-shadow-pane{z-index:300}
.mapwrap .leaflet-tooltip-pane{z-index:350}
.leaflet-container{font-family:var(--text)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.7)}
.mapctl{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:8px}
.mapinfo{
  position:absolute;left:12px;right:12px;bottom:12px;z-index:500;background:rgba(245,245,247,.84);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-radius:var(--r-lg);padding:12px 16px;display:flex;align-items:center;gap:12px;
}
.mk{width:0;height:0}
.mk i{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--primary);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mk.hunter i{background:var(--ink)}
.mk.me i{background:var(--primary-focus)}
.mk.captured i{background:var(--chip)}
.mk.mission i{background:var(--canvas);border-color:var(--ink)}
.mk b{
  position:absolute;left:14px;top:-9px;font-size:11px;font-weight:600;letter-spacing:-0.1px;white-space:nowrap;
  background:rgba(255,255,255,.9);padding:2px 6px;border-radius:var(--r-xs);color:var(--ink);
}
.mk.hunter b{background:var(--ink);color:#fff}
.mk .pulse{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;background:rgba(29,29,31,.18);animation:pl 2s ease-out infinite}
@keyframes pl{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.5);opacity:0}}

/* ── sheet ─────────────────────────────── */
.sheet-bg{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{
  background:var(--parchment);width:100%;max-width:560px;border-radius:var(--r-lg) var(--r-lg) 0 0;
  max-height:88vh;overflow-y:auto;padding-bottom:calc(var(--s-lg) + var(--sab));animation:up .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes up{from{transform:translateY(100%)}}
.sheet .handle{width:36px;height:5px;border-radius:var(--r-pill);background:var(--chip);margin:8px auto}
.sheet header{display:flex;align-items:center;padding:10px var(--s-md);gap:10px}
.sheet header h3{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:0.231px;flex:1}
.sheet .body{padding:0 var(--s-md);display:flex;flex-direction:column;gap:var(--s-md)}

/* ── overlays ─────────────────────────────── */
#takeover{position:fixed;inset:0;z-index:2400;background:var(--black);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:var(--s-xl);text-align:center}
#takeover.on{display:flex;animation:fade .18s}
#takeover .kicker{font-size:14px;letter-spacing:2px;color:var(--body-muted);text-transform:uppercase}
#takeover .big{font-family:var(--display);font-size:64px;font-weight:600;line-height:1.05;letter-spacing:-1px;margin:14px 0 10px}
#takeover .big.alert{color:var(--alert-on-dark)}
#takeover p{color:var(--body-muted);font-size:17px;max-width:32ch}
#takeover .btn{margin-top:var(--s-xl)}

/* ── カウントダウン ───────────────── */
#cdown{position:fixed;inset:0;z-index:2600;background:var(--black);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:var(--s-xl);text-align:center}
#cdown.on{display:flex}
#cdown .kick{font-size:14px;letter-spacing:2px;color:var(--body-muted);text-transform:uppercase}
#cdown .num{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-3px;font-size:min(42vw,220px);margin:18px 0}
#cdown .num.small{font-size:min(26vw,140px);letter-spacing:-2px}
#cdown .num.flash{animation:cdpop .9s ease-out}
@keyframes cdpop{0%{transform:scale(1.35);opacity:.3}40%{opacity:1}100%{transform:scale(1)}}
#cdown .note{color:var(--body-muted);font-size:17px;max-width:30ch}
#cdown .ring{position:absolute;width:min(80vw,420px);height:min(80vw,420px);border-radius:50%;border:1px solid rgba(255,255,255,.14)}
#cdown .btn{margin-top:var(--s-xl)}

/* ── 接近インジケータ ───────────────── */
#prox{position:absolute;left:0;right:0;top:calc(var(--sat) + var(--nav));height:4px;z-index:1150;pointer-events:none;background:transparent;transition:background .4s}
#prox.l1{background:#ffd60a} #prox.l2{background:#ff9f0a} #prox.l3{background:var(--alert);animation:px 1s steps(2,end) infinite}
@keyframes px{50%{opacity:.25}}

/* ── 結果 ───────────────── */
.rank{display:flex;align-items:center;gap:12px;padding:12px var(--s-md);background:var(--canvas)}
.rank + .rank{border-top:1px solid var(--divider)}
.rank .no{font-family:var(--display);font-size:21px;font-weight:600;width:28px;color:var(--ink48);text-align:center;flex:none}
.rank.win .no{color:var(--primary)}
.qrbox{display:grid;place-items:center;padding:16px;background:#fff;border-radius:var(--r-lg);border:1px solid var(--hairline)}
.qrbox canvas,.qrbox img{display:block;width:180px!important;height:180px!important}

#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + var(--nav) + 8px);z-index:3000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{background:rgba(29,29,31,.94);color:#fff;border-radius:var(--r-md);padding:11px 16px;font-size:14px;max-width:520px;width:100%;animation:drop .24s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}

/* ── chat ─────────────────────────────── */
.msgs{flex:1;overflow-y:auto;padding:var(--s-md);display:flex;flex-direction:column;gap:8px}
.bubble{max-width:80%;padding:9px 14px;border-radius:var(--r-lg);font-size:17px;line-height:1.35}
.bubble.them{background:var(--canvas);border:1px solid var(--hairline);align-self:flex-start;border-bottom-left-radius:var(--r-xs)}
.bubble.me{background:var(--primary);color:#fff;align-self:flex-end;border-bottom-right-radius:var(--r-xs)}
.bubble time{display:block;font-size:11px;opacity:.6;margin-top:3px}
.composer .field{flex:1;min-width:0}
.composer{display:flex;gap:8px;padding:10px var(--s-md) calc(10px + var(--sab));background:rgba(245,245,247,.9);backdrop-filter:blur(20px);border-top:1px solid var(--hairline);flex:none}

/* ── 追加パーツ ─────────────────────────── */
.ready{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--hairline);display:grid;place-items:center;flex:none;font-size:12px;color:var(--ink48)}
.ready.on{background:var(--good);border-color:var(--good);color:#fff}
.item{display:flex;align-items:center;gap:12px;padding:12px var(--s-md);background:var(--canvas)}
.item + .item{border-top:1px solid var(--divider)}
.item .ico{width:40px;height:40px;border-radius:var(--r-md);background:var(--parchment);display:grid;place-items:center;flex:none;font-size:19px}
.item.used{opacity:.45}
.spark{display:flex;align-items:flex-end;gap:2px;height:40px;margin-top:8px}
.spark i{flex:1;background:var(--primary);border-radius:1px;min-height:2px;display:block}
.guide h4{font-size:17px;font-weight:600;margin-bottom:4px}
.guide ol{margin:0 0 14px 18px;padding:0}
.guide li{font-size:15px;line-height:1.6;margin-bottom:4px;color:var(--ink80)}
.pin-mk i{background:var(--good)!important;border-radius:3px!important}
.cp-mk i{background:#ff9f0a!important}
.segwrap{display:flex;gap:6px;overflow-x:auto;padding:10px var(--s-md);background:var(--canvas);border-bottom:1px solid var(--divider)}
.segwrap button{padding:6px 12px;border-radius:var(--r-pill);background:var(--parchment);font-size:13px;white-space:nowrap;color:var(--ink80)}
.segwrap button.on{background:var(--primary);color:#fff}

/* ── 大画面モード（会場表示用） ─────────────── */
#bigscreen{
  position:fixed;inset:0;z-index:3200;background:#000;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s-lg);padding:var(--s-xl);
}
#bigscreen .bs-label{font-size:16px;letter-spacing:4px;color:var(--body-muted);text-transform:uppercase}
#bigscreen .bs-time{
  font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;line-height:.95;
  font-size:min(30vw,260px);letter-spacing:-4px;
}
#bigscreen .bs-row{display:flex;gap:var(--s-xl);flex-wrap:wrap;justify-content:center;font-size:min(5vw,28px);color:var(--body-muted)}
#bigscreen .icon-btn{background:rgba(255,255,255,.16);color:#fff}

/* ── 残り時間の大きい表示 ─────────────── */
.nav .clock.big{font-size:22px}

/* ── misc ─────────────────────────────── */
#home-body,#members-body,#mission-body,#notice-body{padding-bottom:28px}
.empty{padding:var(--s-xl) var(--s-md);text-align:center;color:var(--ink48);font-size:14px}
.sep{height:1px;background:var(--divider);margin:0 var(--s-md)}
.switch{width:51px;height:31px;border-radius:var(--r-pill);background:var(--chip);position:relative;flex:none;transition:background .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:#30d158}
.switch.on i{left:22px}
.seg{display:flex;background:var(--chip);border-radius:var(--r-sm);padding:2px}
.seg button{flex:1;padding:7px 4px;font-size:13px;border-radius:6px;color:var(--ink)}
.seg button.on{background:#fff;font-weight:600}
.bar{height:4px;background:var(--divider);border-radius:var(--r-pill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width 1s linear}
.tile .bar{background:rgba(255,255,255,.18)} .tile .bar i{background:#fff}
.fab{position:absolute;right:16px;bottom:16px;z-index:600;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(min-width:900px){
  #app{max-width:100%;}
  .views{max-width:100%}
  #app>.nav,#app>.tabbar{max-width:100%}
  .view>.pad,.view>.section-title,.view>.card{max-width:720px;margin-left:auto;margin-right:auto;width:100%}
  .hero{padding:var(--s-xl) var(--s-md)}
}

/* ── なぞって範囲を描く ───────────────── */
#drawui{position:absolute;inset:0;z-index:600;display:none;pointer-events:none}
.mapwrap.drawing #drawui{display:block}
.mapwrap.drawing .mapctl,.mapwrap.drawing .mapinfo,.mapwrap.drawing .fab{display:none!important}
#drawcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:auto;cursor:crosshair;background:rgba(0,102,204,.04)}
#drawcv.off{pointer-events:none;background:transparent}
#drawbar{position:absolute;left:8px;right:8px;top:8px;pointer-events:auto;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:18px;padding:10px 12px;box-shadow:0 4px 22px rgba(0,0,0,.18)}
#drawbar .dr-row{display:flex;gap:6px;flex-wrap:wrap}
#drawinfo{position:absolute;left:8px;right:8px;bottom:8px;pointer-events:none;display:flex;justify-content:center}
#drawinfo .drinfo{background:rgba(29,29,31,.88);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px}
#drawinfo .drinfo.bad{background:rgba(215,0,21,.92)}
.vtx{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #0066cc;box-shadow:0 1px 6px rgba(0,0,0,.4);margin:3px}
.vtx.deny{border-color:#d70015}
.vtx.sel{background:#0066cc;border-color:#fff}
.vtx.sel.deny{background:#d70015}
.mid{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #0066cc;margin:8px;opacity:.9}
.swatch{width:14px;height:14px;border-radius:4px;border:2px solid #0066cc;background:rgba(0,102,204,.12);flex:none}
.swatch.deny{border-color:#d70015;background:rgba(215,0,21,.25)}
/* ── 位置情報・承認待ちの全画面表示 ───── */
.guardwall{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.93);color:#fff;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.guardwall.on{display:flex}
.guardwall .gw-in{max-width:360px;width:100%}
.guardwall .t-body{color:rgba(255,255,255,.8)}
#mapfail{position:absolute;left:12px;right:12px;top:58px;z-index:450;display:none;background:rgba(29,29,31,.92);color:#fff;border-radius:16px;padding:12px 14px;font-size:14px}
#mapfail.on{display:flex;gap:10px;align-items:center}
#mapfail span{flex:1}

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════
   逃走中 — リアルタイム鬼ごっこ
   役職選択 + 部屋ID + MQTT over WebSocket による端末間同期
   ═══════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => '¥' + Math.floor(n || 0).toLocaleString('ja-JP');
const mmss = s => { s = Math.max(0, Math.round(s)); return pad(Math.floor(s / 60)) + ':' + pad(s % 60); };
const clock = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const uid = n => Array.from({ length: n || 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');

/* ── 状態 ───────────────────────────── */
const ME = { id: uid(8), name: '', role: 'runner', room: '' };
/* 位置の公開は「見る側の役職 > 見られる側の役職」の表で決まる。
   all = 常に見える／near = 一定距離まで近づくと見える／none = 見えない。
   同じ役職どうしは標準で共有（逃走者→逃走者、ハンター→ハンター）。 */
const ROLES = ['runner', 'hunter', 'gm', 'spectator'];
const ROLE_JA = { runner: '逃走者', hunter: 'ハンター', gm: '運営', spectator: '観戦' };
const DEFAULT_VIS = {
  'runner>runner': 'all',   'runner>hunter': 'near', 'runner>gm': 'none',
  'hunter>runner': 'all',   'hunter>hunter': 'all',  'hunter>gm': 'none',
  'spectator>runner': 'all','spectator>hunter': 'all','spectator>gm': 'none'
};
const VIS_JA = { all: '常に', near: '近くだけ', none: '非公開' };
const DEFAULT_CFG = {
  vis: Object.assign({}, DEFAULT_VIS), nearRadius: 300,
  selfShare: true,                 // 参加者が自分の公開先を選べるか
  autoCapture: 0, outsideGrace: 0, preNotice: 30, proximityAlert: true,
  approveCapture: false,           // 確保の報告を運営が承認してから確定
  locked: false,                   // 新しい参加を締め切る
  showCaptured: true,              // 確保済みの人を地図に残す
  edgeTol: 8,                      // 境界の判定に持たせる余裕（m）。GPSのぶれで誤検知しないため
  approveHunter: true,             // ハンターの参加は運営の承認が必要
  approveSpectator: true,          // 観戦の参加は運営の承認が必要
  approveJoin: false,              // 逃走者の参加も承認制にする
  lockOnStart: true,               // ゲーム開始と同時に新規参加を締め切る
  guard: { on: true, maxSpeed: 30, lostWarn: 30, lostCapture: 120, hiddenWarn: 25, strikeCapture: 3, captureRange: 50, requireSig: true, devLock: true }
};
function visOf(viewerRole, targetRole) {
  const v = (G.cfg && G.cfg.vis) || DEFAULT_VIS;
  return v[viewerRole + '>' + targetRole] || DEFAULT_VIS[viewerRole + '>' + targetRole] || 'none';
}
/* 個人ごとの公開設定
   default = 表のとおり／open = 全員に公開／hidden = 運営だけ／custom = 選んだ相手だけ */
function shareOf(m) { return (m && m.share) || { mode: 'default', to: [] }; }
function shareLabel(m) {
  const s = shareOf(m);
  if (s.mode === 'open') return '全員に公開';
  if (s.mode === 'hidden') return '運営だけに公開';
  if (s.mode === 'custom') return (s.to || []).length + '人に公開';
  return '標準（役職の設定どおり）';
}
/* 見る側 viewer から 見られる側 target が見えるか。'all' | 'near' | 'none' */
function visLevel(viewer, target) {
  if (!viewer || !target) return 'none';
  if (viewer.id === target.id) return 'all';
  if (viewer.role === 'gm') return 'all';            // 運営は常に全員の位置を見られる
  const s = shareOf(target);
  if (s.mode === 'hidden') return 'none';
  if (s.mode === 'open') return 'all';
  if (s.mode === 'custom') return (s.to || []).indexOf(viewer.id) >= 0 ? 'all' : 'none';
  return visOf(viewer.role, target.role);
}
const LOCAL = {                      // 端末ごとの設定（共有しない）
  sound: true, vibe: true, speak: true, battery: false, trail: false, follow: true, sort: 'dist', bigClock: false,
  load() { try { Object.assign(this, JSON.parse(localStorage.getItem('tc_local') || '{}')); } catch (e) {} },
  save() {
    try {
      localStorage.setItem('tc_local', JSON.stringify({
        sound: this.sound, vibe: this.vibe, speak: this.speak, battery: this.battery,
        trail: this.trail, follow: this.follow, sort: this.sort, bigClock: this.bigClock
      }));
    } catch (e) {}
  }
};
LOCAL.load();
let G = {
  status: 'lobby', total: 3600, remain: 3600, rate: 100, gm: null, startAt: null, startLabel: '',
  area: { lat: null, lng: null, radius: 800, on: false, zones: [] },
  pins: [], points: [], history: [],
  members: {}, missions: [], events: [], bcasts: [],
  cfg: Object.assign({}, DEFAULT_CFG), ts: Date.now()
};
const POS = {};                 // id -> {lat,lng,acc,ts,bat}
const TRAIL = {};               // id -> [[lat,lng], ...]
function pushTrail(id, lat, lng) {
  const t = TRAIL[id] = TRAIL[id] || [];
  const last = t[t.length - 1];
  if (!last || Math.abs(last[0] - lat) > 2e-5 || Math.abs(last[1] - lng) > 2e-5) t.push([lat, lng]);
  if (t.length > 300) t.shift();
}
const CHAT = {};                // peerId -> [{from,text,ts}]
const UNREAD = {};
let stateRecvAt = 0, myPos = null, tab = 'home', chatPeer = null, seenBc = 0;

const BROKERS = [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
let brokerIdx = 0, customBroker = '';

/* ── 距離 ───────────────────────────── */
function dist(a, b) {
  if (!a || !b || a.lat == null || b.lat == null) return null;
  const R = 6371000, t = Math.PI / 180;
  const dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}
const fmtM = d => d == null ? '—' : d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km';
function moveMeters(p, dx, dy) {
  return { lat: p.lat + dy / 111320, lng: p.lng + dx / (111320 * Math.cos(p.lat * Math.PI / 180)), acc: p.acc, ts: p.ts };
}
function compass(from, to) {
  if (!from || !to) return '';
  const t = Math.PI / 180;
  const y = Math.sin((to.lng - from.lng) * t) * Math.cos(to.lat * t);
  const x = Math.cos(from.lat * t) * Math.sin(to.lat * t) - Math.sin(from.lat * t) * Math.cos(to.lat * t) * Math.cos((to.lng - from.lng) * t);
  const deg = (Math.atan2(y, x) / t + 360) % 360;
  return ['北', '北東', '東', '南東', '南', '南西', '西', '北西'][Math.round(deg / 45) % 8];
}

/* ── 効果音・触覚 ───────────────────────────── */

/* ── 通信 ───────────────────────────── */
const Net = {
  client: null, base: '', up: false, bc: null, lastRx: 0,
  connect(room) {
    this.base = 'tousouchu/v2/' + room + '/';
    try { this.bc = new BroadcastChannel('tousouchu-' + room); this.bc.onmessage = e => Net.route(e.data, true); } catch (e) {}
    this.dial();
  },
  dial() {
    const url = customBroker || BROKERS[brokerIdx % BROKERS.length];
    setNet('wait', '接続中');
    try {
      if (this.client) { try { this.client.end(true); } catch (e) {} }
      this.client = mqtt.connect(url, { clientId: 'tc_' + ME.id, clean: true, reconnectPeriod: 3000, connectTimeout: 7000, keepalive: 30 });
    } catch (e) { setNet('down', '接続失敗'); return; }
    const c = this.client;
    let settled = false;
    c.on('connect', () => {
      settled = true; this.up = true; setNet('ok', ME.room);
      c.subscribe(this.base + '#', { qos: 0 });
      sendHello();
      if (isHost()) GM.publish(true);
    });
    c.on('reconnect', () => setNet('wait', '再接続中'));
    c.on('close', () => { this.up = false; setNet('down', 'オフライン'); });
    c.on('error', () => {
      if (!settled) { brokerIdx++; if (brokerIdx < BROKERS.length + 1 && !customBroker) setTimeout(() => this.dial(), 400); }
    });
    c.on('message', (topic, buf) => {
      let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
      m.__t = topic.slice(this.base.length);
      this.lastRx = Date.now();
      this.route(m);
    });
  },
  pub(sub, obj, retain) {
    obj.__t = sub; obj.ts = obj.ts || Date.now();
    if (sub === 'pos' && obj.hid === undefined) { obj.hid = document.hidden ? 1 : 0; try { if (fxActive('decoy')) obj.dc = 1; } catch (e) {} }
    if (Sec.ok && SIGNED_T.indexOf(sub) >= 0) {
      // 改ざん・なりすまし防止：この端末の秘密鍵で署名して送る
      Sec.ready.then(() => {
        if (!Sec.ok) return this.send(sub, obj, retain);
        obj.pk = Sec.pk;
        return Sec.sign(JSON.stringify(obj)).then(sig => { obj.sig = sig; this.send(sub, obj, retain); });
      }).catch(() => this.send(sub, obj, retain));
      return;
    }
    this.send(sub, obj, retain);
  },
  send(sub, obj, retain) {
    const s = JSON.stringify(obj);
    try { if (this.client && this.up) this.client.publish(this.base + sub, s, { qos: 0, retain: !!retain }); } catch (e) {}

  },
  route(m) {
    if (!m || !m.__t) return;
    if (m.id === ME.id) return;              // 自分の送信は無視
    // 進行を担当する端末は、位置・操作・参加の申請が本人の署名かどうかを確かめてから処理する
    if (isHost() && SIGNED_T.indexOf(m.__t) >= 0) { Sec.gate(m).then(ok => { if (ok) this.dispatch(m); }).catch(() => {}); return; }
    this.dispatch(m);
  },
  dispatch(m) {
    switch (m.__t) {
      case 'state': onState(m.g); break;
      case 'pos':
        if (isHost() && Guard.onPos(m) === false) break;
        POS[m.id] = { lat: m.lat, lng: m.lng, acc: m.acc, bat: m.bat, mv: m.mv, ts: Date.now() }; pushTrail(m.id, m.lat, m.lng);
        if (ME.role === 'gm') GM.touch(m.id); refreshLive(); break;
      case 'hello': if (ME.role === 'gm') GM.hello(m); break;
      case 'act': if (ME.role === 'gm') GM.act(m); break;
      case 'chat': onChat(m); break;
      case 'bc': onBcast(m); break;
      case 'warn': if (m.to === ME.id) onWarn(m); break;
      case 'item': if (m.to === ME.id) { toast('アイテムを受け取りました'); SFX.ping(); } break;
      case 'gmcmd': {
        if (!isHost()) break;
        const sender = G.members[m.id];
        if (!sender || sender.role !== 'gm') break;
        if (HOST_CMDS.indexOf(m.fn) < 0 || typeof GM[m.fn] !== 'function') break;
        GM[m.fn].apply(GM, m.a || []);
        break;
      }
      case 'say': speak(m.text); toast('運営：' + m.text); break;
      case 'ping': if (myPos) { lastPub = 0; Net.pub('pos', { id: ME.id, lat: myPos.lat, lng: myPos.lng, acc: Math.round(myPos.acc), bat: battery, mv: Math.round(STATS.moved) }); } break;
    }
  }
};

/* ── 時間 ───────────────────────────── */
function liveRemain() {
  if (G.status !== 'running') return G.remain;
  const drift = ME.role === 'gm' ? 0 : (Date.now() - stateRecvAt) / 1000;
  return Math.max(0, G.remain - drift);
}
function me() { return G.members[ME.id] || { id: ME.id, name: ME.name, role: ME.role, status: 'active', prize: 0 }; }

function runners() { return membersArr().filter(m => m.role === 'runner'); }

function posOf(id) { const p = POS[id]; return p && Date.now() - p.ts < 180000 ? p : (p || null); }
function isStale(id) { const p = POS[id]; return !p || Date.now() - p.ts > 90000; }

/* ═══════ ゲームマスター＝進行の権限を持つ端末 ═══════ */
const GM = {
  lastPub: 0,
  publish(force) {
    if (!isHost()) return;
    G.ts = Date.now(); G.gm = ME.id; G.host = ME.id; G.hostName = ME.name;
    Net.pub('state', { g: G, id: ME.id }, true);
    this.lastPub = Date.now();
    if (force) renderAll();
  },
  log(kind, text) {
    if (!isHost()) return;
    G.events = G.events || [];

  },
  hello(m) {
    if (!isHost()) return;

    if (!ex) {
      G.members[m.id] = { id: m.id, name: m.name, role: m.role, status: m.role === 'hunter' ? 'hunter' : m.role === 'spectator' ? 'spectator' : 'active', prize: 0, joined: Date.now(), ts: Date.now(), standby: m.role === 'hunter' && G.status === 'running' ? true : undefined };
      this.log('join', m.name + ' が' + ({ hunter: 'ハンター', gm: 'GM', spectator: '観戦者' }[m.role] || '逃走者') + 'として参加しました');

  },
  touch(id) { const m = G.members[id]; if (m) m.ts = Date.now(); },
  act(m) {
    const who = G.members[m.from];
    switch (m.type) {

          if (!t || t.status !== 'active') break;
          G.pending = G.pending || [];

          G.pending.push({ id: uid(4), target: m.target, by: m.from, byName: who ? who.name : 'ハンター', ts: Date.now() });
          this.log('capture', '【申請】' + (who ? who.name : '') + ' → ' + (t.name || '') + ' の確保を申請');

        } else this.capture(m.target, who ? who.name : 'ハンター');

      case 'caught': this.capture(m.from, '自己申告'); break;
      case 'surrender': this.surrender(m.from); break;

      }

    }
    this.log('mission', (ok ? '【成功】' : '【失敗】') + m.title);
    this.broadcast('mission', m.title + (ok ? ' 成功' : ' 失敗'), ok && m.reward ? '賞金 ' + yen(m.reward) + ' を山分けしました。' : (ok ? 'ミッション成功です。' : '達成できませんでした。'), m.to);

  tick() {
    if (!isHost()) { watchHost(); return; }
    if (G.status === 'countdown') {
      if (Date.now() >= G.startAt) this.start();
      else if (Date.now() - this.lastPub > 4000) this.publish();
      return;
    }
    if (G.status === 'running') {
      G.remain = Math.max(0, G.remain - 1);
      alive().forEach(m => {
        m.prize += G.rate * (m.multLeft > 0 ? (m.mult || 2) : 1);
        if (m.multLeft > 0 && --m.multLeft <= 0) { m.multLeft = 0; delete m.mult; }
        if (m.shieldLeft > 0) m.shieldLeft--;
      });
      if ([1800, 900, 600, 300, 120, 60].includes(G.remain))
        this.broadcast('warning', '残り' + (G.remain >= 60 ? Math.floor(G.remain / 60) + '分' : G.remain + '秒'), '逃げ切りまであと少しです。');
      G.missions.forEach(m => {
        if (m.status === 'pending' && m.at != null) {
          const pre = G.cfg.preNotice || 0;
          if (pre && !m.noticed && G.remain <= m.at + pre && G.remain > m.at) {
            m.noticed = true;
            this.broadcast('mission', 'まもなくミッション', pre + '秒後に「' + m.title + '」が発生します。', m.to);
          }
          if (G.remain <= m.at) this.fireMission(m.id);
        } else if (m.status === 'active') { m.left--; if (m.left <= 0) this.endMission(m.id, false); }
      });
      if (G.cfg.autoCapture > 0) this.autoCapture();
      this.checkArea();
      if (G.remain % 30 === 0) { G.history.push({ t: G.remain, a: alive().length }); if (G.history.length > 300) G.history.shift(); }
      (G.sched || []).slice().forEach(x => {
        x.left--;
        if (x.left <= 0) { G.sched = G.sched.filter(y => y.id !== x.id); this.broadcast(x.kind, x.title, x.body); }
      });
      if (G.spotlight && G.spotlight.left > 0) { G.spotlight.left--; if (G.spotlight.left <= 0) { this.log('system', 'スポットライト終了'); G.spotlight = null; } }
      if (G.freeze && G.freeze.left > 0) {
        G.freeze.left--;
        if (G.freeze.left <= 0) { G.freeze = null; this.broadcast('info', 'ストップ解除', '移動を再開してください。'); }
      }
      if (G.remain === 0) this.end(true);
    }
    if (Date.now() - this.lastPub > (G.status === 'running' ? 2000 : 6000)) this.publish();
  },
  checkArea() {
    if (!G.area.on || G.area.lat == null) return;
    alive().forEach(r => {
      const p = posOf(r.id); if (!p) return;
      const out = dist(p, G.area) > G.area.radius;
      if (out && !r.outsideSince) {
        r.outsideSince = Date.now();
        this.log('alert', '【エリア外】' + r.name);
        Net.pub('warn', { id: ME.id, to: r.id, kind: 'outside', grace: G.cfg.outsideGrace });
        toast('エリア外：' + r.name);
      } else if (!out && r.outsideSince) {
        delete r.outsideSince;
        Net.pub('warn', { id: ME.id, to: r.id, kind: 'inside' });
      } else if (out && G.cfg.outsideGrace > 0 && Date.now() - r.outsideSince > G.cfg.outsideGrace * 1000) {
        this.capture(r.id, 'エリア外');
      }
    });
  },
  autoCapture() {
    const hs = hunters().map(h => posOf(h.id) && { m: h, p: posOf(h.id) }).filter(Boolean);
    alive().forEach(r => {
      const p = posOf(r.id); if (!p) return;
      for (const h of hs) if (dist(p, h.p) <= G.cfg.autoCapture) { this.capture(r.id, h.m.name + '（自動判定）'); break; }
    });
  }
};

/* t = { kind: 'all' | 'runner' | 'hunter' | 'alive' | 'captured' | 'ids', ids: [...] }

const TGT_KINDS = ['all', 'runner', 'hunter', 'alive', 'captured', 'ids'];
function tgtNorm(t) {

    case 'ids': return list.filter(m => n.ids.indexOf(m.id) >= 0);
    case 'runner': return list.filter(m => m.role === 'runner');

/* ═══════ 賞金ポイント ═══════ */
let pointSent = {};
function checkPoints() {
  if (ME.role !== 'runner' || G.status !== 'running' || me().status !== 'active' || !myPos) return;
  (G.points || []).forEach(p => {
    if (p.takenBy || pointSent[p.id]) return;
    const d = dist(myPos, p);
    if (d != null && d <= (p.radius || 30)) {
      pointSent[p.id] = true;
      Net.pub('act', { type: 'point', from: ME.id, pointId: p.id, id: ME.id });
      SFX.go(); toast('「' + p.name + '」に到達しました');
    }
  });
}
function nearestPoint() {
  const open = (G.points || []).filter(p => !p.takenBy);
  if (!open.length || !myPos) return null;
  return open.map(p => ({ p, d: dist(myPos, p) })).filter(x => x.d != null).sort((a, b) => a.d - b.d)[0];
}

/* ═══════ ライブ更新（1秒） ═══════ */
function tickLive() {
  if (!ME.room) return;
  const r = liveRemain();
  const nc = $('#navclock');
  nc.textContent = G.status === 'lobby' ? '待機中' : G.status === 'countdown' ? '開始まで ' + mmss(cdLeft()) : mmss(r);
  nc.classList.toggle('crit', G.status === 'running' && r <= 300);
  nc.classList.toggle('big', !!LOCAL.bigClock);
  const ht = $('#hero-time');
  if (ht) { ht.textContent = mmss(r); ht.classList.toggle('crit', G.status === 'running' && r <= 300); }
  const hm = $('#hero-money');
  if (hm) hm.textContent = yen(ME.role === 'gm' ? alive().reduce((a, m) => a + m.prize, 0) : me().prize);
  $$('.js-dist').forEach(el => {
    const d = dist(myPos, posOf(el.dataset.id));
    el.textContent = d == null ? '位置未取得' : fmtM(d) + (el.dataset.dir ? ' ' + compass(myPos, posOf(el.dataset.id)) : '');
  });
  $$('.js-mleft').forEach(el => {
    const m = G.missions.find(x => x.id === el.dataset.id);
    if (m && m.status === 'active') el.textContent = mmss(m.left - (ME.role === 'gm' ? 0 : (Date.now() - stateRecvAt) / 1000));
  });
  if (tab === 'map') { drawMap(); renderMapInfo(); }
  if (Net.up && ME.role !== 'gm' && Date.now() - stateRecvAt > 25000 && stateRecvAt) setNet('wait', '運営 未接続');
  else if (Net.up) setNet('ok', ME.room);
  checkTransition();
  proximity();
  checkPoints();
  freezeView();
  if (followMe && myPos && map && tab === 'map' && LOCAL.follow) map.panTo([myPos.lat, myPos.lng], { animate: false });
  if (outsideUntil) {
    const left = Math.ceil((outsideUntil - Date.now()) / 1000);
    if (left > 0) { $('#tk-text').textContent = left + '秒以内にエリア内へ戻ってください。'; SFX.tick(left <= 5); }

/* ═══════ 状態の切り替わりを見張る ═══════ */
function checkTransition() {
  if (G.status === prevStatus) return;
  const from = prevStatus; prevStatus = G.status;
  if (G.status === 'countdown') { openCountdown(); return; }
  if (from === 'countdown' && G.status === 'running') {
    cdNum(0); SFX.go(); speak('ゲームスタート');
    setTimeout(closeCountdown, 1400);
    return;
  }
  if (from === 'countdown') closeCountdown();
  if (G.status === 'ended') { closeCountdown(); setTimeout(resultSheet, 500); speak('ゲーム終了'); }
}

/* ═══════ 開始カウントダウン ═══════ */
let cdTimer = null, cdLastSec = null;
function openCountdown() {
  if (ME.role === 'gm') cdTarget = G.startAt;
  $('#cdown').classList.add('on');
  $('#cd-note').textContent = G.startLabel || '所定の位置について、開始を待ってください。';
  clearInterval(cdTimer); cdLastSec = null;
  cdTimer = setInterval(cdFrame, 100); cdFrame();
}
function cdLeft() {
  const target = ME.role === 'gm' ? G.startAt : (cdTarget || G.startAt);
  return Math.max(0, (target - Date.now()) / 1000);
}
function cdFrame() {
  if (G.status !== 'countdown' || !G.startAt) return;
  const left = cdLeft();
  const sec = Math.ceil(left);
  if (sec !== cdLastSec) {
    cdLastSec = sec;
    cdNum(sec);
    if (sec <= 10 && sec > 0) { SFX.tick(sec <= 3); if (sec <= 5) speak(String(sec)); }
    else if (sec === 30 || sec === 60 || sec % 300 === 0) speak(sec >= 60 ? Math.round(sec / 60) + '分前' : sec + '秒前');
  }
}
function cdNum(sec) {
  const el = $('#cd-num');
  const txt = sec <= 0 ? 'START' : sec < 60 ? String(sec) : mmss(sec);
  if (el.textContent !== txt) {
    el.textContent = txt;
    el.className = 'num' + (txt.length > 2 ? ' small' : '');
    void el.offsetWidth;
    el.className = 'num flash' + (txt.length > 2 ? ' small' : '');
  }
  $('#cd-kick').textContent = sec <= 0 ? 'GAME START' : 'まもなく開始';
}
function closeCountdown() { clearInterval(cdTimer); cdTimer = null; $('#cdown').classList.remove('on'); }
$('#cd-skip').onclick = closeCountdown;

/* ═══════ ストップ指示 ═══════ */
let freezeShown = false;
function freezeView() {
  const f = G.freeze;
  const target = f && tgtHasMe(f.who);
  if (f && f.left > 0 && target && ME.role !== 'gm') {
    const left = Math.max(0, Math.round(f.left - (Date.now() - stateRecvAt) / 1000));
    if (!freezeShown) { freezeShown = true; SFX.alert(); speak('その場で止まってください'); }
    takeover('STOP', 'その場で止まる', '動かずに待ってください。あと ' + left + ' 秒。', true);
    return;
  }
  if (freezeShown) { freezeShown = false; $('#takeover').classList.remove('on'); }
}

function proximity() {
  const bar = $('#prox');
  if (ME.role !== 'runner' || G.status !== 'running' || me().status !== 'active' || !G.cfg.proximityAlert) { bar.className = ''; proxLevel = 0; return; }
  const d = hunters().filter(h => !h.standby).map(h => dist(myPos, posOf(h.id))).filter(x => x != null).sort((a, b) => a - b)[0];
  const lv = d == null ? 0 : d <= 50 ? 3 : d <= 150 ? 2 : d <= 300 ? 1 : 0;
  bar.className = lv ? 'l' + lv : '';
  const gap = [0, 9000, 4500, 2000][lv];
  if (lv && Date.now() - proxLast > gap) { proxLast = Date.now(); SFX.radar(lv); if (lv === 3 && proxLevel < 3) speak('ハンターが接近しています'); }
  proxLevel = lv;
}

let map = null, layers = {}, mkr = {}, meCircle = null, areaCircle = null, missionMk = {}, pickMk = null, picked = null, mapReady = false, didFit = false, trailLines = {};

function clearTrails() { Object.values(trailLines).forEach(l => map && map.removeLayer(l)); trailLines = {}; }
/* 地図のタイル。OpenStreetMap の公式サーバーは利用規約で外部アプリからの直接利用を
   制限しており弾かれることがあるため、同じ OSM データを配信する CARTO と Esri を使う。
   読み込みに失敗したときは次の候補へ自動で切り替える。 */
const TILES = {
  standard: {
    ja: '標準',
    srcs: [      // [URL, 著作権表示, サブドメイン, 最大ズーム] すべてAPIキー不要
      ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', '地理院タイル', '', 18],
      ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', 'Esri, HERE, Garmin, © OpenStreetMap contributors', '', 19],
      ['https://tile.openstreetmap.jp/{z}/{x}/{y}.png', '© OpenStreetMap contributors', '', 18]
    ]
  },
  plain: {
    ja: 'シンプル',
    srcs: [
      ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', '地理院タイル', '', 18],
      ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', 'Esri', '', 19],
      ['https://tile.openstreetmap.jp/{z}/{x}/{y}.png', '© OpenStreetMap contributors', '', 18]
    ]
  },
  satellite: {
    ja: '航空写真',
    srcs: [
      ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri, Maxar, Earthstar Geographics', '', 19],
      ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', '地理院タイル', '', 18]
    ]
  }
};
const TILE_ORDER = ['standard', 'plain', 'satellite'];
const TILE_JA = { standard: '標準', plain: 'シンプル', satellite: '航空写真' };
let tileSrcIdx = 0, tileErrs = 0, tileErrTimer = null;
let tileKind = 'standard';
function initMap() {
  if (map) return;
  if (typeof L === 'undefined') {                  // 地図ライブラリを読み込めなかった
    const el = $('#map');
    if (el) el.innerHTML = '<div style="padding:72px 24px;text-align:center"><div class="t-strong">地図の部品を読み込めませんでした</div><p class="t-cap" style="margin:8px 0 16px">通信状況を確認して、再読み込みしてください。ほかの機能は使えます。</p><button class="btn" onclick="location.reload()">再読み込み</button></div>';
    return;
  }
  map = L.map('map', { zoomControl: false, attributionControl: true, tap: true });
  map.setView([35.6812, 139.7671], 15);
  setTile('standard');
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);
  map.on('click', e => {
    if (ME.role !== 'gm') return;
    picked = { lat: e.latlng.lat, lng: e.latlng.lng };
    drawMap(); renderMapInfo();
  });
  mapReady = true;
}
function setTile(kind, srcIdx) {
  if (!TILES[kind]) kind = 'standard';
  tileKind = kind;
  tileSrcIdx = srcIdx || 0;
  const src = TILES[kind].srcs[tileSrcIdx] || TILES[kind].srcs[0];
  if (layers.base) { try { map.removeLayer(layers.base); } catch (e) {} }
  tileErrs = 0;
  layers.base = L.tileLayer(src[0], {
    maxZoom: 19, maxNativeZoom: src[3] || 18, subdomains: src[2] || 'abc',
    attribution: src[1], detectRetina: false
  });
  layers.base.on('tileerror', onTileError);
  layers.base.on('tileload', () => { tileErrs = 0; const f = $('#mapfail'); if (f) f.classList.remove('on'); });
  layers.base.addTo(map);
}
/* タイルが続けて失敗したら次の配信元へ切り替える */
function onTileError() {
  tileErrs++;
  if (tileErrTimer) return;
  tileErrTimer = setTimeout(() => {
    tileErrTimer = null;
    if (tileErrs < 4) { tileErrs = 0; return; }
    const srcs = TILES[tileKind].srcs;
    if (tileSrcIdx + 1 < srcs.length) {
      toast('地図の配信元を切り替えました');
      setTile(tileKind, tileSrcIdx + 1);
    } else {
      tileErrs = 0;
      let f = $('#mapfail');
      if (!f) {
        f = document.createElement('div'); f.id = 'mapfail';
        f.innerHTML = '<span>地図の画像を読み込めません。位置・エリアは表示されます。</span><button class="btn sm" id="mapfail-retry">再試行</button>';
        document.querySelector('.mapwrap').appendChild(f);
        $('#mapfail-retry').onclick = () => { f.classList.remove('on'); setTile(tileKind, 0); };
      }
      f.classList.add('on');
    }
  }, 2500);
}

      membersArr().map(m => [m.name, ROLE_JA[m.role], STATUS_JA[m.status] || '', Math.floor(m.prize || 0),
        (POS[m.id] && POS[m.id].mv) || 0, m.capturedBy || '', shareLabel(m)]));
    downloadCSV('tousouchu-roster-' + ME.room + '.csv', rows);
  };
  $('#bu-log').onclick = exportCSV;
  $('#bu-pos').onclick = () => {
    const rows = [['名前', '緯度', '経度', '精度m', '受信時刻']].concat(
      membersArr().filter(m => POS[m.id]).map(m => [m.name, POS[m.id].lat, POS[m.id].lng, Math.round(POS[m.id].acc || 0), new Date(POS[m.id].ts).toLocaleString('ja-JP')]));
    downloadCSV('tousouchu-positions-' + ME.room + '.csv', rows);
  };
}
function downloadCSV(name, rows) {
  download(name, '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv');
  toast('書き出しました');
}
function download(name, text, mime) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  } catch (e) { toast('この端末では書き出せません'); }
}

/* ═══════ 結果 ═══════ */
function sparkCard() {
  const h = G.history || [];
  if (h.length < 3) return '';
  const max = Math.max(1, ...h.map(x => x.a));

function drawQR(url) {
  const box = $('#qr'); if (!box) return;
  const paint = () => {
    try { box.innerHTML = ''; new QRCode(box, { text: url, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); }
    catch (e) { box.innerHTML = '<span class="t-cap">QRコードを表示できません。部屋IDを伝えてください。</span>'; }
  };
  if (window.QRCode) return paint();
  box.innerHTML = '<span class="t-cap">QRコードを読み込み中…</span>';
  const sc = document.createElement('script');
  sc.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
  sc.onload = paint;
  sc.onerror = () => box.innerHTML = '<span class="t-cap">QRコードを表示できません。部屋IDを伝えてください。</span>';
  document.head.appendChild(sc);
}

  const presets = [[10, '10秒'], [30, '30秒'], [60, '1分'], [180, '3分'], [300, '5分'], [600, '10分']];
  sheet('カウントダウンして開始',

    fieldRow('秒数を自由に指定', 'cd-sec', cdPref || 10) +

    '<input class="field" id="cd-label" placeholder="例：スタート地点に集合してください"></div>' +
    '<button class="btn block" id="cd-go">カウントダウンを始める</button>');
  $$('#cd-pre button').forEach(b => b.onclick = () => { $('#cd-sec').value = b.dataset.v; $('#cd-time').value = ''; });
  $('#cd-go').onclick = () => {
    let sec = Math.max(0, Math.round(+$('#cd-sec').value || 0));
    const t = $('#cd-time').value;
    if (t) {
      const [h, mi] = t.split(':').map(Number);
      const d = new Date(); d.setHours(h, mi, 0, 0);
      if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1);
      sec = Math.round((d.getTime() - Date.now()) / 1000);
    }
    if (sec <= 0) return toast('1秒以上を指定してください');
    if (sec > 24 * 3600) return toast('24時間以内で指定してください');
    GM.countdown(sec, $('#cd-label').value.trim());
    closeSheet();
  };
}

  if (ME.role !== 'gm' || isHostFlag) return;

  if (!G.members[ME.id]) G.members[ME.id] = { id: ME.id, name: ME.name, role: 'gm', status: 'active', prize: 0, ts: Date.now() };
  if (Sec.pk) G.members[ME.id].pk = Sec.pk;

function wrapCmd(k) {
  const fn = GM[k];
  if (typeof fn !== 'function') return;
  GM[k] = function () {
    if (ME.role !== 'gm') return;
    if (!isHostFlag) {
      if (!hostAlive()) { toast('主端末に届きません。しばらく待つか、進行を引き継いでください'); return; }
      Net.pub('gmcmd', { id: ME.id, fn: k, a: Array.prototype.slice.call(arguments) });
      toast('主端末に送信しました');
      return;
    }
    return fn.apply(GM, arguments);
  };
}

const _onState = onState;
onState = function (g) {
  if (!g) return;
  // 自分が主端末のときは、ほかの端末の状態で上書きしない
  if (isHost()) {
    // 担当が二重になったときは ID の小さい端末に決める（全端末で同じ結論になる）
    if (g.host && g.host !== ME.id && g.host < ME.id) {
      releaseHost();
      toast('ほかの運営端末が進行を担当します');
    } else return;
  }
  const before = G.members[ME.id] && G.members[ME.id].status;
  const beforeRole = ME.role;

/* 点 p が、ゾーン z の中にあるか。tol は境界の余裕（m）：allow は広めに、deny は狭めに見る */
function inZone(z, p, tol, deny) {
  const t = deny ? -tol : tol;
  if (z.c) return dist(p, z.c) <= z.c.r + t;
  if (!z.pts || z.pts.length < 3) return false;
  const inside = pip(p, z.pts);
  if (deny) return inside && edgeDist(p, z.pts) > tol;
  return inside || edgeDist(p, z.pts) <= tol;
}
function areaState(p, acc) {
  const zs = zonesOf(); if (!zs.length || !p) return { out: false };
  const tol = (G.cfg.edgeTol || 0) + Math.min(acc || 0, 20) * 0.5;
  for (const z of zs) if (z.kind === 'deny' && inZone(z, p, tol, true)) return { out: true, why: '立入禁止：' + (z.name || '') };
  const allows = zs.filter(z => z.kind !== 'deny');
  if (allows.length && !allows.some(z => inZone(z, p, tol, false))) return { out: true, why: 'プレイエリアの外' };
  return { out: false };
}
GM.checkArea = function () {
  if (!zonesOf().length) return;
  alive().forEach(r => {
    const p = POS[r.id]; if (!p || Date.now() - p.ts > 120000) return;
    const st = areaState(p, p.acc), out = st.out;
    if (out && !r.outsideSince) {
      r.outsideSince = Date.now();
      this.log('alert', '【エリア外】' + r.name + '（' + st.why + '）');
      Net.pub('warn', { id: ME.id, to: r.id, kind: 'outside', grace: G.cfg.outsideGrace, why: st.why });
      toast('エリア外：' + r.name);
    } else if (!out && r.outsideSince) {
      delete r.outsideSince;
      Net.pub('warn', { id: ME.id, to: r.id, kind: 'inside' });
    } else if (out && G.cfg.outsideGrace > 0 && Date.now() - r.outsideSince > G.cfg.outsideGrace * 1000) {
      this.capture(r.id, 'エリア外');
    }
  });
};
function areaSummary() {
  if (!G.area.on) return 'オフ';
  const zs = zonesOf(), a = zs.filter(z => z.kind !== 'deny').length, d = zs.length - a;
  if (!zs.length) return '有効（範囲が未設定）';
  return 'プレイエリア ' + a + (d ? ' ／ 立入禁止 ' + d : '') + (G.cfg.outsideGrace ? ' ／ ' + G.cfg.outsideGrace + '秒で確保' : '');
}

/* ── 地図への表示 ── */
const zoneLayers = {};
function drawZones() {
  if (!map) return;
  const seen = {};
  zonesOf().forEach(z => {
    if (DRAW && DRAW.zoneId === z.id) return;
    seen[z.id] = 1;
    const deny = z.kind === 'deny';
    const style = { color: deny ? '#d70015' : '#0066cc', weight: deny ? 2 : 3, dashArray: deny ? null : '9 6', fillColor: deny ? '#d70015' : '#0066cc', fillOpacity: deny ? 0.22 : 0.05, interactive: false };
    const sig = JSON.stringify([z.pts || z.c, z.kind]);
    const cur = zoneLayers[z.id];
    if (cur && cur.sig === sig) return;
    if (cur) map.removeLayer(cur.l);
    const l = z.c ? L.circle([z.c.lat, z.c.lng], Object.assign({ radius: z.c.r }, style)) : L.polygon(z.pts, style);
    l.addTo(map);
    zoneLayers[z.id] = { l, sig };
  });
  Object.keys(zoneLayers).forEach(id => { if (!seen[id]) { map.removeLayer(zoneLayers[id].l); delete zoneLayers[id]; } });
}

/* ── 指でなぞる ── */
let DRAW = null;
function drawDom() {
  let ui = $('#drawui'); if (ui) return ui;
  const wrap = document.querySelector('.mapwrap');
  ui = document.createElement('div'); ui.id = 'drawui';
  ui.innerHTML = '<canvas id="drawcv"></canvas>' +
    '<div id="drawbar"><div class="dr-title t-strong" id="dr-title"></div><div class="t-fine" id="dr-hint"></div>' +
    '<div class="dr-row" id="dr-row1" style="margin-top:8px"></div></div><div id="drawinfo"></div>';
  wrap.appendChild(ui);
  return ui;
}
function startDraw(kind, zoneId) {
  closeSheet(); go('map');
  const wrap = document.querySelector('.mapwrap');
  drawDom();
  let pts = [], name = '', k = kind;
  if (zoneId) {
    const z = (G.area.zones || []).find(x => x.id === zoneId) || zonesOf().find(x => x.id === zoneId);
    if (z) { k = z.kind; name = z.name; pts = z.pts ? z.pts.map(p => p.slice()) : circleToPoly(z.c, 40); }
  }
  DRAW = { kind: k, name, zoneId: zoneId || null, phase: pts.length ? 'edit' : 'draw', pts, panning: false, sel: -1, stroke: [], poly: null, vtx: [], mid: [] };
  wrap.classList.add('drawing');
  setTimeout(() => { try { map.invalidateSize(); } catch (e) {} sizeCanvas(); drawChrome(); if (DRAW.phase === 'edit') { renderEdit(); fitDraw(); } }, 80);
  bindCanvas();
}
function sizeCanvas() {
  const cv = $('#drawcv'); if (!cv) return;
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width)); cv.height = Math.max(1, Math.round(r.height));
}
function fitDraw() { try { map.fitBounds(L.latLngBounds(DRAW.pts).pad(0.3)); } catch (e) {} }
function drawChrome() {
  if (!DRAW) return;
  const deny = DRAW.kind === 'deny';
  $('#dr-title').textContent = (deny ? '立入禁止ゾーン' : 'プレイエリア') + (DRAW.zoneId ? 'を調整' : 'をなぞって作る');
  const cv = $('#drawcv');
  cv.classList.toggle('off', DRAW.phase !== 'draw' || DRAW.panning);
  $('#dr-hint').textContent = DRAW.phase === 'draw'
    ? (DRAW.panning ? '地図を動かせます。描くときは「描く」を押してください。' : '指で囲むようになぞってください。指を離すと自動で閉じます。')
    : '白い丸をドラッグで動かす ／ 小さい丸をタップで頂点を追加 ／ 丸をタップして選んで「頂点を削除」';
  const b = (id, label, cls) => '<button class="btn sm ' + (cls || 'sec') + '" id="' + id + '">' + label + '</button>';
  let h = '';
  if (DRAW.phase === 'draw') {
    h = b('dr-pan', DRAW.panning ? '✍ 描く' : '✋ 地図を動かす') + b('dr-zi', '＋') + b('dr-zo', '－') + b('dr-x', '中止', 'quiet');
  } else {
    h = b('dr-redo', 'なぞり直す') + b('dr-zi', '＋') + b('dr-zo', '－') +
      b('dr-del', '頂点を削除') + b('dr-less', '頂点を減らす') + b('dr-more', '頂点を増やす') + b('dr-ok', '保存', '') + b('dr-x', '中止', 'quiet');
  }
  $('#dr-row1').innerHTML = h;
  const on = (id, fn) => { const e = $('#' + id); if (e) e.onclick = fn; };
  on('dr-pan', () => { DRAW.panning = !DRAW.panning; drawChrome(); setVtxEvents(); });
  on('dr-zi', () => map.zoomIn && map.zoomIn()); on('dr-zo', () => map.zoomOut && map.zoomOut());
  on('dr-x', endDraw);
  on('dr-redo', () => { clearEditLayers(); DRAW.pts = []; DRAW.phase = 'draw'; DRAW.sel = -1; paintStroke(); drawChrome(); drawInfo(); });
  on('dr-del', () => {
    if (DRAW.sel < 0) return toast('削除する丸をタップして選んでください');
    if (DRAW.pts.length <= 3) return toast('頂点は3つ以上必要です');
    DRAW.pts.splice(DRAW.sel, 1); DRAW.sel = -1; renderEdit();
  });
  on('dr-less', () => {
    const before = DRAW.pts.length; if (before <= 3) return toast('これ以上減らせません');
    const q = proj(DRAW.pts); let eps = 1, ids = null;
    while (eps < 80) { const r = simplifyIdx(q, eps); if (r.length < before && r.length >= 3) { ids = r; break; } eps *= 1.4; }
    if (!ids) return toast('これ以上減らせません');
    DRAW.pts = ids.map(i => DRAW.pts[i]); DRAW.sel = -1; renderEdit();
  });
  on('dr-more', () => {
    if (DRAW.pts.length > 120) return toast('頂点が多すぎます');
    const out = [];
    DRAW.pts.forEach((p, i) => { const n = DRAW.pts[(i + 1) % DRAW.pts.length]; out.push(p, [+((p[0] + n[0]) / 2).toFixed(6), +((p[1] + n[1]) / 2).toFixed(6)]); });
    DRAW.pts = out; DRAW.sel = -1; renderEdit();
  });
  on('dr-ok', saveDraw);
}
function simplifyIdx(q, eps) {                       // 間引いたあとに残る点の番号
  const pts = q.map((p, i) => [p[0], p[1], i]), r = rdp(pts.concat([pts[0]]), eps);
  const ids = r.slice(0, -1).map(p => p[2]);
  return ids;
}
function paintStroke() {
  const cv = $('#drawcv'); if (!cv) return;
  const c = cv.getContext && cv.getContext('2d'); if (!c) return;
  c.clearRect(0, 0, cv.width, cv.height);
  const s = DRAW && DRAW.stroke; if (!s || !s.length) return;
  c.lineWidth = 4; c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = DRAW.kind === 'deny' ? '#d70015' : '#0066cc';
  c.beginPath(); c.moveTo(s[0][0], s[0][1]); s.forEach(p => c.lineTo(p[0], p[1]));
  c.setLineDash([8, 8]); c.lineTo(s[0][0], s[0][1]); c.stroke(); c.setLineDash([]);
}
function bindCanvas() {
  const cv = $('#drawcv');
  const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => {
    if (!DRAW || DRAW.phase !== 'draw' || DRAW.panning) return;
    try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    DRAW.stroke = [pt(e)]; DRAW.drawing = true; e.preventDefault();
  };
  cv.onpointermove = e => {
    if (!DRAW || !DRAW.drawing) return;
    const p = pt(e), l = DRAW.stroke[DRAW.stroke.length - 1];
    if (Math.hypot(p[0] - l[0], p[1] - l[1]) >= 2) { DRAW.stroke.push(p); paintStroke(); }
    e.preventDefault();
  };
  const up = () => { if (DRAW && DRAW.drawing) { DRAW.drawing = false; finishStroke(); } };
  cv.onpointerup = up; cv.onpointercancel = up;
  window.addEventListener('resize', sizeCanvas);
}
function finishStroke() {
  const s = DRAW.stroke; DRAW.stroke = [];
  let len = 0; for (let i = 1; i < s.length; i++) len += Math.hypot(s[i][0] - s[i - 1][0], s[i][1] - s[i - 1][1]);
  paintStroke();
  if (s.length < 6 || len < 80) return toast('もう少し大きく、囲むようになぞってください');
  let r = rdp(s.concat([s[0]]), 5).slice(0, -1);
  if (r.length > 1 && Math.hypot(r[r.length - 1][0] - r[0][0], r[r.length - 1][1] - r[0][1]) < 10) r.pop();
  if (r.length < 3) return toast('形がつかめませんでした。もう一度なぞってください');
  DRAW.pts = r.map(p => { const ll = map.containerPointToLatLng(L.point(p[0], p[1])); return [+ll.lat.toFixed(6), +ll.lng.toFixed(6)]; });
  DRAW.phase = 'edit'; DRAW.sel = -1; DRAW.panning = false;
  renderEdit(); drawChrome();
}
function clearEditLayers() {
  if (!DRAW || !map) return;
  if (DRAW.poly) { map.removeLayer(DRAW.poly); DRAW.poly = null; }
  DRAW.vtx.forEach(m => map.removeLayer(m)); DRAW.mid.forEach(m => map.removeLayer(m));
  DRAW.vtx = []; DRAW.mid = [];
}
function setVtxEvents() { /* 地図を動かすモードでは丸も触れないようにする */
  const ui = $('#drawui'); if (ui) ui.classList.toggle('panning', !!(DRAW && DRAW.panning));
}
function renderEdit() {
  clearEditLayers();
  const deny = DRAW.kind === 'deny', col = deny ? '#d70015' : '#0066cc';
  DRAW.poly = L.polygon(DRAW.pts, { color: col, weight: 3, fillColor: col, fillOpacity: deny ? .25 : .12, dashArray: deny ? null : '9 6', interactive: false }).addTo(map);
  const ll = p => L.latLng ? L.latLng(p[0], p[1]) : p;
  DRAW.pts.forEach((p, i) => {
    const mk = L.marker(p, { draggable: true, zIndexOffset: 1000, icon: L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14], html: '<div class="vtx' + (DRAW.sel === i ? ' sel' : '') + (deny ? ' deny' : '') + '"></div>' }) }).addTo(map);
    mk.on('drag', e => { const q = e.target.getLatLng(); DRAW.pts[i] = [q.lat, q.lng]; DRAW.poly.setLatLngs(DRAW.pts); drawInfo(); });
    mk.on('dragend', e => { const q = e.target.getLatLng(); DRAW.pts[i] = [+q.lat.toFixed(6), +q.lng.toFixed(6)]; DRAW.sel = i; renderEdit(); });
    mk.on('click', () => { DRAW.sel = DRAW.sel === i ? -1 : i; renderEdit(); });
    DRAW.vtx.push(mk);
  });
  DRAW.pts.forEach((p, i) => {
    const n = DRAW.pts[(i + 1) % DRAW.pts.length], mid = [(p[0] + n[0]) / 2, (p[1] + n[1]) / 2];
    const mk = L.marker(mid, { zIndexOffset: 900, icon: L.divIcon({ className: '', iconSize: [28, 28], iconAnchor: [14, 14], html: '<div class="mid"></div>' }) }).addTo(map);
    mk.on('click', () => { DRAW.pts.splice(i + 1, 0, [+mid[0].toFixed(6), +mid[1].toFixed(6)]); DRAW.sel = i + 1; renderEdit(); });
    DRAW.mid.push(mk);
  });
  drawInfo();
}
function drawInfo() {
  const e = $('#drawinfo'); if (!e || !DRAW) return;
  if (DRAW.phase !== 'edit') { e.innerHTML = ''; return; }
  const bad = selfIntersects(DRAW.pts);
  e.innerHTML = '<div class="drinfo ' + (bad ? 'bad' : '') + '">面積 ' + fmtArea(ringArea(DRAW.pts)) + ' ／ 外周 ' + fmtM(ringLen(DRAW.pts)) + ' ／ 頂点 ' + DRAW.pts.length + (bad ? ' ／ ⚠ 線が交差しています' : '') + '</div>';
}
function saveDraw() {
  if (!DRAW || DRAW.pts.length < 3) return toast('範囲を描いてください');
  if (selfIntersects(DRAW.pts)) return toast('線が交差しています。丸を動かして直してください');
  if (ringArea(DRAW.pts) < 100) return toast('範囲が小さすぎます');
  const zs = (G.area.zones || []).slice();
  const def = DRAW.name || (DRAW.kind === 'deny' ? '立入禁止' : 'プレイエリア') + (zs.filter(z => z.kind === DRAW.kind).length + (DRAW.zoneId ? 0 : 1));
  const name = (prompt('このゾーンの名前', def) || def).slice(0, 14);
  const z = { id: DRAW.zoneId || uid(4), kind: DRAW.kind, name, pts: DRAW.pts.map(p => [+(+p[0]).toFixed(6), +(+p[1]).toFixed(6)]) };
  const i = zs.findIndex(x => x.id === z.id);
  if (i >= 0) zs[i] = z; else zs.push(z);
  // 昔の円だけの設定は、なぞった範囲に置き換える（残したいときは円で追加し直す）
  GM.setArea({ zones: zs, on: true });
  endDraw(true);
  toast('保存しました');
}
function endDraw(saved) {
  if (!DRAW) return;
  clearEditLayers();
  const wrap = document.querySelector('.mapwrap'); if (wrap) wrap.classList.remove('drawing');
  DRAW = null;
  paintStroke();
  window.removeEventListener('resize', sizeCanvas);
  drawZones();
  go('home'); areaSheet();
}

/* ── エリア設定の画面 ── */
function areaSheet() {
  const zs = G.area.zones || [];
  const legacy = !zs.length && G.area.lat != null;
  const list = (zs.length ? zs : legacy ? [{ id: 'c0', kind: 'allow', name: 'プレイエリア（円）', c: { lat: G.area.lat, lng: G.area.lng, r: G.area.radius } }] : []).map(z => {
    const deny = z.kind === 'deny';
    const size = z.c ? '半径 ' + Math.round(z.c.r) + 'm' : fmtArea(ringArea(z.pts)) + ' ／ 頂点 ' + z.pts.length;
    return '<div class="row"><span class="swatch ' + (deny ? 'deny' : '') + '"></span><span class="grow"><span class="t-strong">' + esc(z.name) + '</span><br><span class="t-fine">' + (deny ? '立入禁止' : 'プレイエリア') + ' ／ ' + size + '</span></span>' +
      '<button class="btn sm sec" data-z="show" data-id="' + z.id + '">表示</button><button class="btn sm sec" data-z="edit" data-id="' + z.id + '">形を直す</button><button class="btn sm quiet" data-z="del" data-id="' + z.id + '">削除</button></div>';
  }).join('');
  sheet('エリア設定',
    '<p class="t-cap">地図を指でなぞって、逃走者が動いてよい範囲を決めます。外に出た人（または立入禁止に入った人）を運営の画面で検知し、猶予のあと自動で確保にもできます。</p>' +
    '<div class="card flush"><div class="row"><span class="grow t-strong">エリアの判定</span><span class="switch ' + (G.area.on ? 'on' : '') + '" id="ar-sw"><i></i></span></div></div>' +
    '<div class="stack" style="margin:12px 0">' +
    '<button class="btn block" id="ar-draw">✍ 指でなぞってプレイエリアを作る</button>' +
    '<button class="btn sec block" id="ar-deny">⛔ 立入禁止ゾーンをなぞる</button></div>' +
    (list ? '<div class="section-title">設定中の範囲</div><div class="card flush">' + list + '</div>' : '<p class="t-fine">まだ範囲がありません。上のボタンから作ってください。</p>') +
    '<div class="section-title">円で追加（かんたん）</div>' +
    fieldRow('半径（m）', 'ar-r', 300) +
    '<div class="stack"><button class="btn sec block" id="ar-here">現在地を中心に円を追加</button>' +
    (picked ? '<button class="btn sec block" id="ar-pick">地図で選んだ地点に円を追加</button>' : '') + '</div>' +
    '<div class="section-title">判定</div>' +
    fieldRow('範囲外に出てから確保するまでの猶予（秒・0なら警告だけ）', 'ar-g', G.cfg.outsideGrace) +
    fieldRow('境界の余裕（m）・GPSのぶれで誤検知しないため', 'ar-t', G.cfg.edgeTol == null ? 8 : G.cfg.edgeTol) +
    '<div class="stack"><button class="btn block" id="ar-save">判定の設定を保存</button>' +
    (zs.length || legacy ? '<button class="btn quiet block" id="ar-clear">範囲をすべて消す</button>' : '') + '</div>');
  const addCircle = c => {
    const r = Math.max(30, +$('#ar-r').value || 300), z = (G.area.zones || []).slice();
    if (!z.length && legacy) z.push({ id: 'c0', kind: 'allow', name: 'プレイエリア（円）', c: { lat: G.area.lat, lng: G.area.lng, r: G.area.radius } });
    z.push({ id: uid(4), kind: 'allow', name: '円' + (z.length + 1), c: { lat: +c.lat.toFixed(6), lng: +c.lng.toFixed(6), r } });
    GM.setArea({ zones: z, on: true }); areaSheet();
  };
  $('#ar-sw').onclick = () => { GM.setArea({ on: !G.area.on }); drawMap(); areaSheet(); };
  $('#ar-draw').onclick = () => startDraw('allow');
  $('#ar-deny').onclick = () => startDraw('deny');
  $('#ar-here').onclick = () => { if (!myPos) return toast('現在地を取得できていません'); addCircle(myPos); };
  if ($('#ar-pick')) $('#ar-pick').onclick = () => addCircle(picked);
  $('#ar-save').onclick = () => { GM.setCfg({ outsideGrace: Math.max(0, +$('#ar-g').value || 0), edgeTol: Math.max(0, +$('#ar-t').value || 0) }); toast('保存しました'); };
  if ($('#ar-clear')) $('#ar-clear').onclick = () => confirmSheet('範囲をすべて消しますか', 'プレイエリアと立入禁止ゾーンが消えます。', '消す', () => { GM.setArea({ zones: [], lat: null, lng: null, on: false }); drawMap(); areaSheet(); });
  $$('#sheet-body [data-z]').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (b.dataset.z === 'edit') {
      startDraw('allow', id);
    } else if (b.dataset.z === 'del') {
      const next = zs.filter(z => z.id !== id);
      GM.setArea(legacy && id === 'c0' ? { lat: null, lng: null, on: false } : { zones: next }); drawMap(); areaSheet();
    } else {
      const z = zonesOf().find(x => x.id === id); if (!z) return;
      closeSheet(); go('map');
      setTimeout(() => { try { map.invalidateSize(); z.c ? map.fitBounds(L.latLng(z.c.lat, z.c.lng).toBounds(z.c.r * 2.4)) : map.fitBounds(L.latLngBounds(z.pts).pad(0.25)); } catch (e) {} }, 120);
    }
  });
}
